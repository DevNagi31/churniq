name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q tests/ --maxfail=1 --disable-warnings

      - name: Smoke test full pipeline
        run: |
          PYTHONPATH=. python scripts/build_data.py
          test -s public/data/overview.json
          test -s public/data/cohorts.json
          test -s public/data/segments.json
          test -s public/data/clv.json
          test -s public/data/churn.json
          test -s public/data/campaigns.json

  frontend:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python (for data pipeline)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build data
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. python scripts/build_data.py

      - name: Install Node deps and build
        run: |
          npm ci
          npm run build
